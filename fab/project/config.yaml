project:
    description: FAB Kit — Tooling for Specification-Driven Development
    linear_workspace: null
    name: fab-kit
source_paths:
    - src/
    - scripts/
test_paths:
    - '**/*_test.go'
true_impact_exclude:
    - fab/
    - docs/

# >>> fab reference (kit 2.16.19) >>> --------------------------------------
# Overridable fields you have NOT overridden, with current defaults.
# REGENERATED by `fab config upgrade` on every upgrade — edits inside this
# fence are overwritten. To override a field: move it ABOVE the fence and
# uncomment it.
#
# checklist.extra_categories — project-specific quality categories appended to
# the built-in plan.md ## Acceptance categories (functional_completeness,
# behavioral_correctness, scenario_coverage, edge_cases, code_quality, security).
# Each becomes an extra subsection under plan.md ## Acceptance.
# checklist:
#   extra_categories: []               # example: [performance, accessibility, i18n]
#
# consolidate.detectors — duplicate-detection commands /fab-dedupe runs to seed
# its sweep. Each entry is a shell command template; {paths} (the resolved scope)
# and {out} (a scratch dir) are substituted at run time as shell-quoted values,
# so paths containing spaces or shell metacharacters stay intact arguments.
# A detector whose binary is missing is skipped silently; a non-zero exit is
# treated as a finding, not an error. Detectors only SEED the sweep — the agent
# does the clustering.
# consolidate:
#   detectors:
#     - jscpd --reporters json --output {out} {paths}
#
# providers — named agent invocation grammars plus their optional default fill.
# Each provider MAY carry two command fields (they are NOT merged — session and
# dispatch are different invocations of the same binary):
#   session_command  — opens an interactive agent SESSION (fab operator /
#                       fab batch / fab agent). {model}/{effort} placeholders are
#                       substituted from the resolved tier profile, or from the
#                       --model/--effort flags on `fab agent --provider <name>`
#                       (which bypasses tier resolution); the built-in commands
#                       below are all templated this way. A command carrying
#                       NO placeholder instead gets --model/--effort appended.
#   dispatch_command — runs ONE headless stage task via fab dispatch. ABSENT →
#                      native Agent-tool dispatch (the default). There is NO
#                      fallback from dispatch_command to session_command. fab
#                      dispatch pipes the stage prompt to the command's STDIN.
# and two optional fill fields that supply those placeholders by default:
#   model / effort   — this provider's DEFAULT FILL. Position in the precedence:
#                      invocation flag > explicit tier field > provider fill >
#                      empty (empty drops the placeholder's token, so the CLI's
#                      own default applies). Scope `both`, so a machine-wide fill
#                      is settable once in ~/.fab-kit/config.yaml.
# Provider names are opaque, user-chosen strings — fab NEVER infers a provider
# from a model string. The cutoff is by provider NAME, not by vendor: a tier that
# explicitly sets `provider:` to a name differing from the built-in tier's loses
# that tier's model/effort inheritance and fills its unset fields from THAT
# provider's own fill, then empty — even when the two names front the same vendor
# (a second claude entry under another name still loses the inheritance). Pin
# `model:` on the tier to be explicit.
#
# fab-kit ships THREE built-in providers — claude (the default), codex, and
# gemini — as GRAMMAR ONLY: the command templates are built into the binary, but
# no built-in carries a model/effort fill (non-claude model IDs rot at CLI
# cadence, so they belong in config, not in a release). Naming codex or gemini in
# a tier (or via `fab agent --provider` / `fab resolve-agent --provider`) resolves
# with NO providers: block at all; set providers.<name>.model to pin its fill.
# Every block below is shown commented because it merely restates a built-in
# default — except claude's session_command, shown live as the baseline example.
# Note codex/gemini DO carry a dispatch_command, so naming one flips that tier's
# stages from native Agent-tool dispatch to headless CLI dispatch; claude's
# dispatch_command is deliberately absent from the built-in (uncommenting the
# line below flips claude's stages the same way).
#
# Per-provider notes (kept out of the blocks below so uncommenting a whole block
# yields valid YAML — strip the leading '# ' from every line of a block):
#   claude.dispatch_command — claude -p reads the prompt from stdin; uncommenting
#     runs claude's stages as headless CLI processes instead of native sub-agents.
#   codex — codex exec reads the prompt from stdin. Set providers.codex.model to a
#     current model ID (e.g. gpt-5.3-codex) — fab ships none and does not validate it.
#   gemini — no {effort} (the gemini CLI has no reasoning-effort flag) and no -p:
#     gemini's -p takes prompt TEXT (appended after stdin), whereas fab dispatch
#     pipes the prompt to stdin, which gemini reads as the prompt in non-TTY mode.
# providers:
#   claude:
#     session_command: 'claude --dangerously-skip-permissions -n "$(basename "$(pwd)")" --model {model} --effort {effort}'
#     # dispatch_command: 'claude -p --dangerously-skip-permissions --model {model} --effort {effort}'
#   # codex:
#   #   session_command: 'codex -m {model} -c model_reasoning_effort={effort}'
#   #   dispatch_command: 'codex exec -m {model} -c model_reasoning_effort={effort}'
#   #   model: gpt-5.3-codex                    # example fill — fab ships no model ID for codex
#   #   effort: high
#   # gemini:
#   #   session_command: 'gemini -m {model}'
#   #   dispatch_command: 'gemini -m {model}'   # no {effort} flag; no -p (fab dispatch pipes the prompt to stdin)
#   #   model: gemini-2.5-pro                   # example fill — fab ships no model ID for gemini
#
# agent.tiers — per-stage model override. A "tier" is a named
# {provider, model, effort} profile (the invocation command lives on the provider,
# above — NOT on the tier). fab-kit owns the FIXED, non-overridable stage→tier
# mapping below; you override only WHAT EACH TIER MEANS. Omit any tier (or the
# whole tiers: block) to use fab-kit's built-in default. An omitted field within a
# tier inherits the project's `default` tier, then fab-kit's built-in; an empty
# model means "inherit the session model". Resolved per stage by
# `fab resolve-agent <stage>` at sub-agent dispatch time. Values pass through
# verbatim — fab does no provider validation. See docs/specs/stage-models.md.
#
# FIXED stage→tier mapping (fab-owned, NOT overridable — shown for reference):
#   default   intake (advisory), fab batch, fab agent, /fab-proceed create-intake
#   doing     apply, review-pr
#   fast      ship, /fab-proceed prefix steps
#   hydrate   hydrate
#   operator  fab operator (coordinator session)
#   review    review
#
# fab-kit's built-in default profiles (today):
# agent:
#   tiers:
#     default:  { provider: claude, model: claude-fable-5, effort: high }
#     doing:    { provider: claude, model: claude-opus-5, effort: high }
#     fast:     { provider: claude, model: claude-sonnet-5, effort: medium }
#     hydrate:  { provider: claude, model: claude-opus-5, effort: high }
#     operator: { provider: claude, model: claude-sonnet-5, effort: medium }
#     review:   { provider: claude, model: claude-opus-5, effort: high }
#
# dispatch.watchable — opt in to WATCHABLE-PANE dispatch for providers that
# carry only a session_command (e.g. the built-in claude). When true, TMUX
# PRESENCE decides the adapter: inside tmux (`$TMUX` set) `fab resolve-agent`
# emits a `dispatch=` line for such a provider, so the stage dispatches into a
# tmux pane you can watch and steer; outside tmux the line is omitted and the
# stage stays on native Agent-tool dispatch. HEADLESS CLI dispatch is never
# reached this way — it stays gated on a real dispatch_command.
# A provider's own dispatch_command always WINS (unchanged); watchable only
# ADDS eligibility for providers that have none — so it replaces uncommenting
# claude's dispatch_command, which would also flip every OUT-of-tmux dispatch
# to headless CLI. Scope `both`, so it is settable once machine-wide in
# ~/.fab-kit/config.yaml. Default false (byte-stable current behavior).
#
# dispatch.column_width — width, in PERCENT of the window, of the pane-worker
# column a pane-mode stage worker is opened into. The first worker CARVES the
# column out of the dispatching agent's pane (`tmux split-window -h -l <n>%`),
# so the agent you are watching keeps the other 65%; later workers STACK
# inside that column with unsized `-v` splits and the left/right separator is
# never touched again. An absent key — or a value outside 1..99 — resolves to
# the default (an absent yaml int is indistinguishable from 0, and 0/100 are
# degenerate widths). A tmux too old for `-l <n>%` (pre-3.1) degrades to an
# unsized split with a warning rather than failing the dispatch. Scope `both`,
# so it is settable once machine-wide in ~/.fab-kit/config.yaml.
# dispatch:
#   watchable: false
#   column_width: 35
#
# stage_hooks — optional per-stage pre/post shell commands honored by
# `fab status start` / `fab status finish`. Each command runs as `sh -c` from
# the repo root. A failing `pre` hook blocks `fab status start`; a `post` hook
# runs after `finish` saves. Not seeded by the scaffold — add by hand.
# Valid stage keys: apply, hydrate, intake, review, review-pr, ship.
# stage_hooks:
#   apply:
#     pre: ./scripts/check-clean-tree.sh
#     post: make test
#
# branch_prefix — optional prefix applied by `fab batch switch` when creating
# worktree branches (branch name = `{branch_prefix}{folder_name}`). Empty when
# absent.
# branch_prefix: ""
# <<< end fab reference <<< ------------------------------------------------
