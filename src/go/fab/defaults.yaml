# fab-kit's built-in agent defaults — the bottom tier of the config cascade
# (env > system > project > this file). Lives at the Go module root for
# visibility; embedded into the binary via go:embed (the root fab package in
# defaults.go, parsed and consumed by internal/agent); never read from the kit
# cache at runtime, so a binary can never disagree with the defaults it shipped
# with.
#
# Shaped exactly as a user config-file fragment in the config.yaml schema: the
# same keys a project writes to override any of these values. That shape is the
# point — everything in this file is user-overridable by writing the same key in
# fab/project/config.yaml (or ~/.fab-kit/config.yaml). Everything that stays in
# Go is fab-owned policy, not tunable data: the fixed stage→role mapping
# (stageRoles in agent.go) and the role→depth partition (roleDepth) are
# deliberately NOT here.
#
# TO BUMP A MODEL: edit the line below, then run the tests. Every other place
# that restates these values is drift-guarded and will name itself in the
# failure output — you do not have to go find them:
#
#   TestDefaultsFileIsWellFormed          this file parses + covers every role/CLI (defaults_test.go)
#   TestDefaultRoleProfilesArePinned      the deliberate-change pin, claude (agent_test.go)
#   TestNonClaudeCLIFillsArePinned   the same pin for codex/agy/kimi (agent_test.go)
#   TestDocTablesMatchAgentMaps           docs/specs/stage-models.md § default-role TABLE
#
# That table is the ONE doc mirror left, and the only place outside this file that
# spells a shipped model ID. Everything else derives: the docs that used to restate
# the fills (stage-models.md's clis sample, _cli-fab.md's resolve-agent
# enumeration) now show SHAPE only and point at `fab resolve-agent` /
# `fab config explain clis --json`, and every test builds its expectation from
# DefaultProfile() via the cmd/fab `roleFill` helper. So a model bump is this file
# plus that table — nothing else.

# agent.session / agent.workers — the two advertised knobs, selecting a CLI
# by agent DEPTH. session = the Tier-1 roles a user talks to (default, operator);
# workers = the Tier-2 roles pipeline stages dispatch to (doing, review, hydrate,
# fast). Both ship as claude, so a fresh install writes nothing.
agent:
  session: claude
  workers: claude

# agent_presets — the built-in named role assignments a user selects with the
# scalar `agent.preset` (FAB_AGENT_PRESET in the environment). Each is a SPARSE
# bundle of fields fab already has (session, workers, profiles.<role>.{cli,
# model,effort}); a preset only adds a rung to the fill precedence, spliced in at
# the config layer that chose it, directly below that layer's own explicit
# agent.* fields. They are INERT until selected (presence=intent), so a fresh
# install resolves byte-identically to today. internal/agent's init() pushes this
# table into internal/config (config cannot import agent), which composes it as
# the lowest tier of the definitions merge. `none` is reserved ("no preset here")
# and can never be defined. codex-review sets only the review role's cli, so its
# model/effort re-derive from codex's own fills (clis.codex.profiles.review).
agent_presets:
  claude:
    description: All roles on Claude (today's defaults)
    session: claude
    workers: claude
  codex-workers:
    description: Pipeline workers on Codex; session on Claude
    workers: codex
  codex-review:
    description: Only the review role on Codex
    profiles:
      review: { cli: codex }

# dispatch — the built-in stage-dispatch defaults, and the SINGLE VALUE SOURCE
# for all five: internal/agent's init() pushes these parsed values into
# internal/config's DefaultDispatchMode / DefaultDispatchColumnWidth /
# DefaultDispatchReapDone / DefaultDispatchMinCols / DefaultDispatchMinRows
# vars, which carry no literal of their own (the push runs agent → config
# because agent imports config; the reverse would cycle). No Go file holds a
# copy — TestDefaultsFileDispatchBlockIsPinned pins these values and
# TestConfigDispatchDefaultsMatchDefaultsFile guards the push, so a drift or a
# broken wiring names itself in the failure output. reap_done is parsed as a
# *bool (see config.DispatchConfig): an absent key must stay distinguishable
# from an explicit false, which a plain bool cannot do. min_cols/min_rows are
# the geometry floor: a split that would land the worker below them demotes to
# a manually-sized window instead.
dispatch:
  mode: native
  column_width: 45
  min_cols: 50
  min_rows: 20
  reap_done: true

# clis — the built-in launch capability grammars plus each CLI's per-role
# fills. claude, codex and agy ship fills, so `agent.workers: codex` is one line
# and every role still gets a model suited to it. claude's fills are the family
# ALIASES (opus / sonnet): `claude --model` resolves each to the newest model of that
# family, so they track the installed tool and never need a kit release. Only codex's
# and agy's fills are concrete IDs, refreshed at KIT-RELEASE cadence (see
# docs/specs/stage-models.md § Refreshing the non-claude fills). Every fill is an
# unvalidated pass-through value, and a stale one is corrected by a single config
# line (clis.<name>.profiles.<role>.model) — a louder, cheaper failure than the
# empty-model resolution that shipping nothing produced.
#
# kimi is the deliberate exception: it ships NO fills at all, because its -m takes a
# USER-CONFIG model alias rather than a catalog ID (see its block below). Empty is
# the correct built-in there, not a gap.
#
# CLI fields are pure capability grammar: presence says "here is how", never
# "select this mode". dispatch.mode owns the preference; automatic resolution
# descends pane → native → headless against these capabilities.
#
# interactive_command is LAUNCH GRAMMAR ONLY — how to open an interactive session.
# Nothing is appended to it: a pane worker's stage prompt is delivered AFTERWARDS by
# fab itself (`fab dispatch deliver` types a pointer through tmux and verifies it
# landed), so pane capability no longer depends on whether a CLI accepts a positional
# initial prompt.
#
# fab's dispatch, pane, operator, and batch launches run both commands under the
# user's interactive shell —
# ${SHELL:-/bin/sh} -i -c '<command>' — because tmux and the headless wrapper
# otherwise run them non-interactively, without the rc files where users export
# CLI auth tokens and PATH. Do not hand-wrap a command in `$SHELL -i -c` in
# your config: it is unnecessary (a pre-wrapped command still works; it nests).
#
# Every supported agent CLI has an interactive mode, so pane launch grammar is the
# built-in expectation. The generic readiness gate owns CLI first-run walls and
# input-echo validation; HEADLESS prompt grammar is the capability that varies and
# needs a CLI-specific probe. A user-defined CLI may still omit
# interactive_command, in which case automatic resolution skips the pane rung.
#
# agy's first-run trust prompt is an ordinary readiness-gate judgment round, like
# kimi's: one answer clears the wall for that exact workspace. Users may additionally
# seed the exact-match trustedWorkspaces entry in
# ~/.gemini/antigravity-cli/settings.json; fab ships no CLI-specific seeding.
#
# kimi's probe is DONE (2026-08-10, kimi 0.34.0): its first-run "Trust this folder?"
# wall is an ordinary readiness-gate judgment round (one Enter, remembered per
# folder), and its input echo verifies now that the gate's squeeze drops box-drawing
# runes as well as whitespace — kimi's input box draws vertical side rules, which a
# wrap interleaves between the halves. So kimi ships an interactive_command below and
# is pane-capable.
clis:
  claude:
    native: true
    interactive_command: 'claude --permission-mode bypassPermissions -n "$(basename "$(pwd)")" --model {model} --effort {effort}'
    headless_command: 'claude -p --permission-mode bypassPermissions --model {model} --effort {effort}'
    # The six role fills. `default` doubles as this CLI's cross-role
    # fallback: a role absent here resolves the `default` entry, then empty.
    # The models are the family ALIASES `opus` / `sonnet`, not versioned IDs:
    # `claude --model` and the Agent tool's `model` parameter both take them and
    # resolve the newest model of the family, so these rows track the installed
    # Claude Code with no kit release. Pin a specific model by overriding
    # clis.claude.profiles.<role>.model with a full ID (claude-opus-5-5).
    # Every effort is explicit because fab never relies on a model's own default
    # (both command templates above pass --effort), and an alias can move to a
    # model whose default differs. Today Opus 5.5 defaults to `medium`, so dropping
    # `effort: high` would silently step the opus rows DOWN a level; Sonnet 5.5
    # defaults to `high`, so dropping `effort: medium` would step operator/fast UP
    # one. doing/hydrate's `effort: high` equals Sonnet 5.5's default today and
    # stays explicit anyway — the next Sonnet may not match.
    profiles:
      default:  { model: opus,   effort: high }
      operator: { model: sonnet, effort: medium }
      doing:    { model: sonnet, effort: high }
      review:   { model: opus,   effort: high }
      hydrate:  { model: sonnet, effort: high }
      fast:     { model: sonnet, effort: medium }
  codex:
    # `codex exec` is a SUBCOMMAND (not a flag) and reads the prompt from stdin,
    # which is where `fab dispatch` pipes it. Both forms bypass approvals and the
    # sandbox: stage workers are unattended and cannot answer approval prompts,
    # matching claude's shipped `--permission-mode bypassPermissions` posture.
    interactive_command: 'codex --dangerously-bypass-approvals-and-sandbox -m {model} -c model_reasoning_effort={effort}'
    headless_command: 'codex exec --dangerously-bypass-approvals-and-sandbox -m {model} -c model_reasoning_effort={effort}'
    # The codex CLI takes a concrete catalog SLUG (`-m`, no alias mechanism), so
    # these are pinned IDs and the rows to bump when the catalog moves — verify a
    # slug against the INSTALLED binary's cached catalog (~/.codex/models_cache.json:
    # slug, priority, description, supported reasoning levels), never from memory.
    #
    # DENSE on purpose: every role pins its own model, so a `default` bump never
    # silently repoints another role (the pre-wcib effort-only doing/review rows
    # took their model from `default`). Author and critic deliberately run
    # DIFFERENT models — doing writes on the top catalog model, review reads on
    # another — so the reviewer does not share the author's blind spots.
    #
    # Effort ceiling: never ship `ultra` (codex: "automatic task delegation" — a
    # worker spawning its own sub-agents breaks the single-worker dispatch
    # contract); `max` is an explicit-override level only.
    profiles:
      default:  { model: gpt-6-astra,  effort: high }
      doing:    { model: gpt-6-astra,  effort: high }
      review:   { model: gpt-5.6-sol,  effort: xhigh }
      hydrate:  { model: gpt-5.6-sol,  effort: high }
      operator: { model: gpt-5.6-luna, effort: medium }
      fast:     { model: gpt-5.6-luna, effort: low }
  agy:
    # Antigravity CLI. Model IDs embed the reasoning effort (e.g. gemini-3.1-pro-high),
    # so there is NO {effort} placeholder — a separate --effort flag exists but would
    # fight the suffix. agy -p takes the prompt as an ARGUMENT and ignores stdin, and
    # POSIX expands $(cat) BEFORE applying the < redirect, so the headless command
    # nests a shell: the inner sh's stdin IS the redirected prompt file.
    # --print-timeout raised from its 5m default — stage workers run far longer.
    # The interactive form is pure full-auto launch grammar. A fresh workspace may
    # stop at agy's trust prompt before delivery; the readiness gate reports it as
    # parked and one bounded judgment round clears it. The trust decision is stored
    # per exact workspace path and may also be seeded by the user (see the block note).
    interactive_command: 'agy --dangerously-skip-permissions --model {model}'
    headless_command: 'sh -c ''agy --dangerously-skip-permissions --print-timeout 120m --model {model} -p "$(cat)"'''
    # Sparse and model-only (the effort rides the ID's suffix). `default` is the
    # cross-role fallback, so doing/review/hydrate/operator all take the pro-high
    # model without a row of their own; `fast` takes the cheaper flash tier. These
    # are concrete IDs from `agy models`, so they are the rows to bump when that
    # catalog moves.
    profiles:
      default: { model: gemini-3.1-pro-high }
      fast:    { model: gemini-3.6-flash-low }
  kimi:
    # kimi-code CLI (Kimi K3). Ships NO fills: -m takes a USER-CONFIG model alias
    # (managed installs: kimi-code/k3; custom providers differ), so a pinned value
    # would break non-managed setups. The empty {model} drops the -m flag entirely
    # (WithProfile empty-value token-drop) and kimi falls back to the user's
    # default_model. -p is already non-interactive and auto-approves tools; it
    # REJECTS --yolo/--auto ("Cannot combine --prompt with --yolo"), so the
    # dispatch form carries no approval flag. Same nested-shell stdin idiom as agy.
    # The INTERACTIVE form is where the full-auto flag belongs: --auto is kimi's
    # unattended posture, matching claude's shipped --permission-mode bypassPermissions.
    # Its {model} resolves empty (no fills), so the -m pair drops out and kimi runs
    # on the user's own default_model.
    interactive_command: 'kimi --auto -m {model}'
    headless_command: 'sh -c ''kimi -m {model} -p "$(cat)"'''
