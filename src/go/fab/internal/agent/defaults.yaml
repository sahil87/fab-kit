# fab-kit's built-in agent defaults — the defaults layer under the config
# cascade (project > system > this file). Embedded into the binary via
# go:embed (internal/agent); never read from the kit cache at runtime, so a
# binary can never disagree with the defaults it shipped with.
#
# Shaped exactly as a user config-file fragment in the config.yaml schema: the
# same keys a project writes to override any of these values. That shape is the
# point — everything in this file is user-overridable by writing the same key in
# fab/project/config.yaml (or ~/.fab-kit/config.yaml). Everything that stays in
# Go is fab-owned policy, not tunable data: the fixed stage→role mapping
# (stageRoles in agent.go) and the role→depth partition (roleDepth) are
# deliberately NOT here.
#
# TO BUMP A MODEL: edit the line below, then run the tests. Every other place
# that restates these values is drift-guarded and will name itself in the
# failure output — you do not have to go find them:
#
#   TestDefaultsFileIsWellFormed          this file parses + covers every role/provider (defaults_test.go)
#   TestDefaultRoleProfilesArePinned      the deliberate-change pin, claude (agent_test.go)
#   TestNonClaudeProviderFillsArePinned   the same pin for codex/gemini (agent_test.go)
#   TestDocTablesMatchAgentMaps           docs/specs/stage-models.md § default-role TABLE
#   TestMirrorDocsMatchDefaultProfiles    docs/specs/stage-models.md inline-YAML sample (all 3 providers)
#   TestCLIFabReferenceListsDefaultRoles  src/kit/skills/_cli-fab.md § resolve-agent enumeration
#
# No other test hardcodes these strings — the rest derive from DefaultProfile(),
# so a bump does not touch them.

# agent.session / agent.workers — the two advertised knobs, selecting a provider
# by agent DEPTH. session = the Tier-1 roles a user talks to (default, operator);
# workers = the Tier-2 roles pipeline stages dispatch to (doing, review, hydrate,
# fast). Both ship as claude, so a fresh install writes nothing.
agent:
  session: claude
  workers: claude

# providers — the built-in invocation grammars plus each provider's per-role
# fills. ALL THREE ship fills, so `agent.workers: codex` is one line and every
# role still gets a model suited to it. Non-claude fills are refreshed at
# KIT-RELEASE cadence (see docs/specs/stage-models.md § Refreshing the non-claude
# fills): they are unvalidated pass-through values, and a stale one is corrected by
# a single config line (providers.<name>.profiles.<role>.model) — a louder, cheaper
# failure than the empty-model resolution that shipping nothing produced.
#
# claude deliberately carries NO dispatch_command — its absence is what selects
# native Agent-tool dispatch. codex and gemini carry one, so pointing a role at
# either flips that role's stages to headless CLI dispatch.
providers:
  claude:
    session_command: 'claude --dangerously-skip-permissions -n "$(basename "$(pwd)")" --model {model} --effort {effort}'
    # The six role fills. `default` doubles as this provider's cross-role
    # fallback: a role absent here resolves the `default` entry, then empty.
    profiles:
      default:  { model: claude-fable-5,  effort: high }
      operator: { model: claude-sonnet-5, effort: medium }
      doing:    { model: claude-opus-5,   effort: high }
      review:   { model: claude-opus-5,   effort: high }
      hydrate:  { model: claude-opus-5,   effort: high }
      fast:     { model: claude-sonnet-5, effort: medium }
  codex:
    # `codex exec` is a SUBCOMMAND (not a flag) and reads the prompt from stdin,
    # which is where `fab dispatch` pipes it.
    session_command: 'codex -m {model} -c model_reasoning_effort={effort}'
    dispatch_command: 'codex exec -m {model} -c model_reasoning_effort={effort}'
    # Sparse: a role absent here resolves the `default` entry, so hydrate and
    # operator get the frontier model at `high` without a row of their own. The
    # codex CLI takes a concrete model SLUG (no alias mechanism), so these are
    # pinned IDs and are the rows to bump when the catalog moves.
    profiles:
      default: { model: gpt-5.6-sol,  effort: high }
      doing:   { effort: xhigh }        # model inherits `default`
      review:  { effort: xhigh }
      fast:    { model: gpt-5.6-luna, effort: low }
  gemini:
    # No {effort}: the gemini CLI has no reasoning-effort flag, so a resolved
    # effort has nowhere to go. No `-p` on the dispatch command either: gemini's
    # -p takes prompt TEXT (appended after stdin), whereas `fab dispatch` pipes
    # the prompt to stdin, which gemini reads as the prompt in non-TTY mode.
    session_command: 'gemini -m {model}'
    dispatch_command: 'gemini -m {model}'
    # Model-only, for the same no-{effort} reason. These are the gemini CLI's own
    # stable ALIASES, not versioned IDs: `-m pro` / `-m flash` resolve to whatever
    # that CLI's current best pro/flash model is for the caller's entitlement, and
    # degrade gracefully without preview access — so these rows do not rot. The
    # aliases are a CLI VERSION FLOOR, though: a gemini older than its
    # resolveModel() alias support sees `pro` as an unknown model ID and fails
    # there — fixed by a full versioned ID in providers.gemini.profiles.<role>.model,
    # or by upgrading the CLI.
    profiles:
      default: { model: pro }
      fast:    { model: flash }
