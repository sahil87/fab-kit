# fab-kit's built-in agent defaults — the bottom tier of the config cascade
# (env > system > project > this file). Embedded into the binary via
# go:embed (internal/agent); never read from the kit cache at runtime, so a
# binary can never disagree with the defaults it shipped with.
#
# Shaped exactly as a user config-file fragment in the config.yaml schema: the
# same keys a project writes to override any of these values. That shape is the
# point — everything in this file is user-overridable by writing the same key in
# fab/project/config.yaml (or ~/.fab-kit/config.yaml). Everything that stays in
# Go is fab-owned policy, not tunable data: the fixed stage→role mapping
# (stageRoles in agent.go) and the role→depth partition (roleDepth) are
# deliberately NOT here.
#
# TO BUMP A MODEL: edit the line below, then run the tests. Every other place
# that restates these values is drift-guarded and will name itself in the
# failure output — you do not have to go find them:
#
#   TestDefaultsFileIsWellFormed          this file parses + covers every role/provider (defaults_test.go)
#   TestDefaultRoleProfilesArePinned      the deliberate-change pin, claude (agent_test.go)
#   TestNonClaudeProviderFillsArePinned   the same pin for codex/agy/kimi (agent_test.go)
#   TestDocTablesMatchAgentMaps           docs/specs/stage-models.md § default-role TABLE
#   TestMirrorDocsMatchDefaultProfiles    docs/specs/stage-models.md inline-YAML sample (all 4 providers)
#   TestCLIFabReferenceListsDefaultRoles  src/kit/skills/_cli-fab.md § resolve-agent enumeration
#
# No other test hardcodes these strings — the rest derive from DefaultProfile(),
# so a bump does not touch them.

# agent.session / agent.workers — the two advertised knobs, selecting a provider
# by agent DEPTH. session = the Tier-1 roles a user talks to (default, operator);
# workers = the Tier-2 roles pipeline stages dispatch to (doing, review, hydrate,
# fast). Both ship as claude, so a fresh install writes nothing.
agent:
  session: claude
  workers: claude

# dispatch — the built-in stage-dispatch defaults, and the SINGLE VALUE SOURCE
# for all three: internal/agent's init() pushes these parsed values into
# internal/config's DefaultDispatchMode / DefaultDispatchColumnWidth /
# DefaultDispatchReapDone vars, which carry no literal of their own (the push
# runs agent → config because agent imports config; the reverse would cycle).
# No Go file holds a copy — TestDefaultsFileDispatchBlockIsPinned pins these
# values and TestConfigDispatchDefaultsMatchDefaultsFile guards the push, so a
# drift or a broken wiring names itself in the failure output. reap_done is
# parsed as a *bool (see config.DispatchConfig): an absent key must stay
# distinguishable from an explicit false, which a plain bool cannot do.
dispatch:
  mode: native
  column_width: 35
  reap_done: true

# providers — the built-in launch capability grammars plus each provider's per-role
# fills. claude, codex and agy ship fills, so `agent.workers: codex` is one line
# and every role still gets a model suited to it. Non-claude fills are refreshed at
# KIT-RELEASE cadence (see docs/specs/stage-models.md § Refreshing the non-claude
# fills): they are unvalidated pass-through values, and a stale one is corrected by
# a single config line (providers.<name>.profiles.<role>.model) — a louder, cheaper
# failure than the empty-model resolution that shipping nothing produced.
#
# kimi is the deliberate exception: it ships NO fills at all, because its -m takes a
# USER-CONFIG model alias rather than a catalog ID (see its block below). Empty is
# the correct built-in there, not a gap.
#
# Provider fields are pure capability grammar: presence says "here is how", never
# "select this mode". dispatch.mode owns the preference; automatic resolution
# descends pane → native → headless against these capabilities.
#
# interactive_command is LAUNCH GRAMMAR ONLY — how to open an interactive session.
# Nothing is appended to it: a pane worker's stage prompt is delivered AFTERWARDS by
# fab itself (`fab dispatch deliver` types a pointer through tmux and verifies it
# landed), so pane capability no longer depends on whether a CLI accepts a positional
# initial prompt.
#
# All four built-ins are pane-capable. What has to be probed per provider is
# FIRST-RUN behavior and input echo, not prompt grammar — and both agy's and kimi's
# first-run trust walls ("Trust this folder?" and agy's per-workspace trust prompt,
# which fires even under --dangerously-skip-permissions) are ordinary readiness-gate
# judgment rounds: one answer clears the wall and the answer is remembered per folder,
# so it amortizes across every later pane worker in that checkout. agy's trust store
# (~/.gemini/antigravity-cli/settings.json, exact-match paths) is additionally
# user-seedable — a user-side optimization, nothing fab ships.
#
# kimi's probe is DONE (2026-08-10, kimi 0.34.0): its first-run "Trust this folder?"
# wall clears as above, and its input echo verifies now that the gate's squeeze drops
# box-drawing runes as well as whitespace — kimi's input box draws vertical side
# rules, which a wrap interleaves between the halves.
providers:
  claude:
    native: true
    interactive_command: 'claude --dangerously-skip-permissions -n "$(basename "$(pwd)")" --model {model} --effort {effort}'
    headless_command: 'claude -p --dangerously-skip-permissions --model {model} --effort {effort}'
    # The six role fills. `default` doubles as this provider's cross-role
    # fallback: a role absent here resolves the `default` entry, then empty.
    profiles:
      default:  { model: claude-fable-5,  effort: high }
      operator: { model: claude-sonnet-5, effort: medium }
      doing:    { model: claude-opus-5,   effort: high }
      review:   { model: claude-opus-5,   effort: high }
      hydrate:  { model: claude-opus-5,   effort: high }
      fast:     { model: claude-sonnet-5, effort: medium }
  codex:
    # `codex exec` is a SUBCOMMAND (not a flag) and reads the prompt from stdin,
    # which is where `fab dispatch` pipes it. Both forms bypass approvals and the
    # sandbox: stage workers are unattended and cannot answer approval prompts,
    # matching claude's shipped `--dangerously-skip-permissions` posture.
    interactive_command: 'codex --dangerously-bypass-approvals-and-sandbox -m {model} -c model_reasoning_effort={effort}'
    headless_command: 'codex exec --dangerously-bypass-approvals-and-sandbox -m {model} -c model_reasoning_effort={effort}'
    # Sparse: a role absent here resolves the `default` entry, so hydrate gets
    # the frontier model at `high` without a row of its own. The codex CLI takes
    # a concrete model SLUG (no alias mechanism), so these are pinned IDs and
    # are the rows to bump when the catalog moves.
    profiles:
      default:  { model: gpt-5.6-sol,  effort: high }
      operator: { model: gpt-5.6-luna, effort: medium }
      doing:    { effort: xhigh }        # model inherits `default`
      review:   { effort: xhigh }
      fast:     { model: gpt-5.6-luna, effort: low }
  agy:
    # Antigravity CLI. Model IDs embed the reasoning effort (e.g. gemini-3.1-pro-high),
    # so there is NO {effort} placeholder — a separate --effort flag exists but would
    # fight the suffix. agy -p takes the prompt as an ARGUMENT and ignores stdin, and
    # POSIX expands $(cat) BEFORE applying the < redirect, so the headless command
    # nests a shell: the inner sh's stdin IS the redirected prompt file.
    # --print-timeout raised from its 5m default — stage workers run far longer.
    # The interactive form carries the same full-auto posture flag as the headless
    # one; its fresh-workspace trust prompt is an ordinary readiness-gate judgment
    # round (see the providers-block note above).
    interactive_command: 'agy --dangerously-skip-permissions --model {model}'
    headless_command: 'sh -c ''agy --dangerously-skip-permissions --print-timeout 120m --model {model} -p "$(cat)"'''
    # Sparse and model-only (the effort rides the ID's suffix). `default` is the
    # cross-role fallback, so doing/review/hydrate/operator all take the pro-high
    # model without a row of their own; `fast` takes the cheaper flash tier. These
    # are concrete IDs from `agy models`, so they are the rows to bump when that
    # catalog moves.
    profiles:
      default: { model: gemini-3.1-pro-high }
      fast:    { model: gemini-3.6-flash-low }
  kimi:
    # kimi-code CLI (Kimi K3). Ships NO fills: -m takes a USER-CONFIG model alias
    # (managed installs: kimi-code/k3; custom providers differ), so a pinned value
    # would break non-managed setups. The empty {model} drops the -m flag entirely
    # (WithProfile empty-value token-drop) and kimi falls back to the user's
    # default_model. -p is already non-interactive and auto-approves tools; it
    # REJECTS --yolo/--auto ("Cannot combine --prompt with --yolo"), so the
    # dispatch form carries no approval flag. Same nested-shell stdin idiom as agy.
    # The INTERACTIVE form is where the full-auto flag belongs: --auto is kimi's
    # unattended posture, matching claude's shipped --dangerously-skip-permissions.
    # Its {model} resolves empty (no fills), so the -m pair drops out and kimi runs
    # on the user's own default_model.
    interactive_command: 'kimi --auto -m {model}'
    headless_command: 'sh -c ''kimi -m {model} -p "$(cat)"'''
